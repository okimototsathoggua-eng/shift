<!DOCTYPE html>
<html lang="ja" class="h-full w-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ShiftSnap - 勤務シフト＆有給管理</title>

  <!-- PWA & フルスクリーン設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ShiftSnap" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#4F46E5" />

  <!-- アプリアイコン -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ec4899'/><path d='M30 25h40v50H30z' fill='none' stroke='white' stroke-width='6'/><path d='M30 40h40M45 20v10M55 20v10' stroke='white' stroke-width='6' stroke-linecap='round'/><circle cx='50' cy='58' r='7' fill='white'/></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ec4899'/><path d='M30 25h40v50H30z' fill='none' stroke='white' stroke-width='6'/><path d='M30 40h40M45 20v10M55 20v10' stroke='white' stroke-width='6' stroke-linecap='round'/><circle cx='50' cy='58' r='7' fill='white'/></svg>" />

  <!-- Tailwind CSS & React / Babel -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- React Image Crop -->
  <script src="https://unpkg.com/react-image-crop@10.0.9/dist/ReactCrop.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/react-image-crop@10.0.9/dist/ReactCrop.css" />

  <style>
    html, body, #root {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .top-safe-area {
      padding-top: max(12px, env(safe-area-inset-top));
    }
    .bottom-safe-area {
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .ReactCrop__crop-selection {
      border: 2px solid #EC4899 !important;
      background-color: rgba(236, 72, 153, 0.2) !important;
    }
    
    /* スタンプモード時のアニメーション */
    @keyframes stampBounce {
      0% { transform: scale(1); }
      50% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .stamp-click {
      animation: stampBounce 0.2s ease-in-out;
    }
  </style>
</head>
<body class="h-full w-full font-sans antialiased text-slate-800 bg-slate-100">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const apiKey = ""; // Gemini APIキーをここに入力してください

    const Icons = {
      Calendar: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>,
      Camera: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
      Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
      Palmtree: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4"/></svg>,
      Close: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>,
      Sparkles: () => <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M5 2a1 1 0 011 1v1h1a1 1 0 010 2H6v1a1 1 0 01-2 0V6H3a1 1 0 010-2h1V3a1 1 0 011-1zm0 10a1 1 0 011 1v1h1a1 1 0 110 2H6v1a1 1 0 11-2 0v-1H3a1 1 0 110-2h1v-1a1 1 0 011-1zM12 2a1 1 0 01.967.744L14.146 7.2 17.5 9.134a1 1 0 010 1.732l-3.354 1.935-1.18 4.455a1 1 0 01-1.933 0L9.854 12.8 6.5 10.866a1 1 0 010-1.732l3.354-1.935 1.18-4.455A1 1 0 0112 2z" clipRule="evenodd"/></svg>,
      Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
      ExternalLink: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>,
      Scissors: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2-2m-2-2l-2-2a3 3 0 10-4.243 4.243l2 2m4 4l2 2a3 3 0 104.243-4.243l-2-2m-4-4l2-2"/></svg>,
      CursorClick: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/></svg>,
      Pencil: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
    };

    const DEFAULT_SHIFT_PATTERNS = [
      { id: 'dayB', name: '日B', symbol: '日B', startTime: '09:00', endTime: '18:00', breakTime: 60, color: '#2563EB', bgColor: '#DBEAFE', paidLeaveHours: 0 },
      { id: 'junta', name: '準A', symbol: '準A', startTime: '13:00', endTime: '22:00', breakTime: 60, color: '#7C3AED', bgColor: '#EDE9FE', paidLeaveHours: 0 },
      { id: 'day', name: '日勤', symbol: '日', startTime: '09:00', endTime: '18:00', breakTime: 60, color: '#059669', bgColor: '#D1FAE5', paidLeaveHours: 0 },
      { id: 'off', name: '公休', symbol: '公', startTime: '', endTime: '', breakTime: 0, color: '#64748B', bgColor: '#F1F5F9', paidLeaveHours: 0 },
      { id: 'paid_full', name: '有給', symbol: '有', startTime: '', endTime: '', breakTime: 0, color: '#DB2777', bgColor: '#FCE7F3', paidLeaveHours: 8 },
      { id: 'paid_half', name: '半休', symbol: '半', startTime: '09:00', endTime: '13:30', breakTime: 0, color: '#E11D48', bgColor: '#FFE4E6', paidLeaveHours: 4 },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('calendar');

      const [targetName, setTargetName] = useState('中野 優希');
      const [targetAliases, setTargetAliases] = useState('中野, 中野優希, 優希');
      const [workHoursPerDay, setWorkHoursPerDay] = useState(8);
      const [shiftPatterns, setShiftPatterns] = useState(DEFAULT_SHIFT_PATTERNS);

      const [basePaidLeaveDays, setBasePaidLeaveDays] = useState(15);
      const [grantMonth, setGrantMonth] = useState(4);
      const [grantDay, setGrantDay] = useState(1);
      const [grantAmountDays, setGrantAmountDays] = useState(12);
      const [baseYear, setBaseYear] = useState(2026);

      const [currentDate, setCurrentDate] = useState(new Date());
      const [shifts, setShifts] = useState([]);

      // スタンプ入力（連続タップ）モード用
      const [stampModeActive, setStampModeActive] = useState(false);
      const [selectedStampPattern, setSelectedStampPattern] = useState(null);

      // スキャン用ステート
      const [selectedImage, setSelectedImage] = useState(null); 
      const [croppedImageBase64, setCroppedImageBase64] = useState(null); 
      const [crop, setCrop] = useState({ unit: '%', width: 90, height: 10, x: 5, y: 45 }); 
      const [isCropping, setIsCropping] = useState(false); 
      const [isScanning, setIsScanning] = useState(false);
      const [scanResults, setScanResults] = useState([]);
      const [scanMessage, setScanMessage] = useState('');
      const [toastMessage, setToastMessage] = useState(null);
      const imgRef = useRef(null);
      const fileInputRef = useRef(null);

      // モーダル (シフト追加/編集)
      const [editingShift, setEditingShift] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);

      // モーダル (パターン編集)
      const [isPatternModalOpen, setIsPatternModalOpen] = useState(false);
      const [editingPattern, setEditingPattern] = useState(null);
      const [newPatternName, setNewPatternName] = useState('');

      const showToast = (msg, type = 'info') => {
        setToastMessage({ msg, type });
        setTimeout(() => setToastMessage(null), 3000);
      };

      const calculatePaidLeave = () => {
        const cYear = currentDate.getFullYear();
        const cMonth = currentDate.getMonth() + 1;
        const cDay = currentDate.getDate();

        let addedGrants = 0;
        if (cYear > baseYear) {
          for (let y = baseYear + 1; y <= cYear; y++) {
            if (y < cYear) {
              addedGrants += grantAmountDays;
            } else {
              if (cMonth > grantMonth || (cMonth === grantMonth && cDay >= grantDay)) {
                addedGrants += grantAmountDays;
              }
            }
          }
        }

        const totalHoursAvailable = (basePaidLeaveDays + addedGrants) * workHoursPerDay;
        const totalHoursConsumed = shifts.reduce((sum, s) => sum + (Number(s.paidLeaveHours) || 0), 0);
        
        const curMonthPrefix = `${cYear}-${String(cMonth).padStart(2, '0')}`;
        const monthlyHoursConsumed = shifts
          .filter(s => s.date.startsWith(curMonthPrefix))
          .reduce((sum, s) => sum + (Number(s.paidLeaveHours) || 0), 0);

        const remainingHours = Math.max(0, totalHoursAvailable - totalHoursConsumed);
        const remainingDays = Math.floor(remainingHours / workHoursPerDay);
        const remainingExtraHours = Math.round((remainingHours % workHoursPerDay) * 10) / 10;

        return {
          totalHoursAvailable,
          totalHoursConsumed,
          monthlyHoursConsumed,
          remainingHours,
          remainingDays,
          remainingExtraHours
        };
      };
      const paidLeaveStats = calculatePaidLeave();

      // 画像選択
      const handleImageChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          setSelectedImage(event.target.result);
          setIsCropping(true); 
          setCroppedImageBase64(null);
          setScanResults([]);
          setScanMessage('');
        };
        reader.readAsDataURL(file);
        e.target.value = null;
      };

      const onImageLoad = useCallback((e) => {
        imgRef.current = e.currentTarget;
      }, []);

      const finalizeCrop = () => {
        if (!imgRef.current || !crop.width || !crop.height) {
          showToast('切り抜く範囲を選択してください', 'error');
          return;
        }

        const canvas = document.createElement('canvas');
        const scaleX = imgRef.current.naturalWidth / imgRef.current.width;
        const scaleY = imgRef.current.naturalHeight / imgRef.current.height;
        canvas.width = crop.width * scaleX;
        canvas.height = crop.height * scaleY;
        const ctx = canvas.getContext('2d');

        ctx.drawImage(
          imgRef.current,
          crop.x * scaleX,
          crop.y * scaleY,
          crop.width * scaleX,
          crop.height * scaleY,
          0,
          0,
          crop.width * scaleX,
          crop.height * scaleY
        );

        const base64Image = canvas.toDataURL('image/jpeg', 0.9);
        setCroppedImageBase64({
          data: base64Image.split(',')[1],
          mimeType: 'image/jpeg',
          previewUrl: base64Image
        });
        setIsCropping(false);
      };

      const handleScanShiftTable = async () => {
        if (!croppedImageBase64) {
          showToast('画像が切り抜かれていません', 'error');
          return;
        }

        setIsScanning(true);
        setScanMessage('切り抜かれた1行をAIが解析中...');
        setScanResults([]);

        try {
          const year = currentDate.getFullYear();
          const month = currentDate.getMonth() + 1;

          const systemPrompt = `あなたはOCRスペシャリストです。提供された画像は、勤務シフト表の「特定の個人の1ヶ月分（1日〜末日）のシフト記号」が横一列に並んだ画像です。
左から順番に、1日、2日、3日...と対応しています。
画像内にある記号（例: 日B, 準A, 公, 有, 半 など）を左から順番に読み取ってください。
空欄や斜線（/）は「公休」扱いとしてください。

登録されているシフトパターン: ${JSON.stringify(shiftPatterns.map(p => ({ name: p.name, symbol: p.symbol, hours: p.paidLeaveHours })))}
対象年月: ${year}年${month}月

必ず以下のJSON形式のみで出力してください:
{
  "shifts": [
    { "date": "YYYY-MM-DD", "shiftName": "読み取った記号", "startTime": "HH:MM", "endTime": "HH:MM", "paidLeaveHours": 数値, "note": "" }
  ]
}`;

          const payload = {
            contents: [{
              role: "user",
              parts: [
                { text: `左から順に ${year}年${month}月 の1日からのシフトを抽出してください。` },
                { inlineData: { mimeType: croppedImageBase64.mimeType, data: croppedImageBase64.data } }
              ]
            }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  shifts: {
                    type: "ARRAY",
                    items: {
                      type: "OBJECT",
                      properties: {
                        date: { type: "STRING" },
                        shiftName: { type: "STRING" },
                        startTime: { type: "STRING" },
                        endTime: { type: "STRING" },
                        paidLeaveHours: { type: "NUMBER" },
                        note: { type: "STRING" }
                      },
                      required: ["date", "shiftName"]
                    }
                  }
                },
                required: ["shifts"]
              }
            }
          };

          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          
          if (!res.ok) throw new Error('API Error');
          
          const data = await res.json();
          const parsedText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!parsedText) throw new Error('No data');
          
          const parsed = JSON.parse(parsedText);

          const list = (parsed.shifts || []).map((s, idx) => {
            const p = shiftPatterns.find(pat => pat.name === s.shiftName || pat.symbol === s.shiftName);
            const hours = Number(s.paidLeaveHours) || p?.paidLeaveHours || 0;
            return {
              id: `scan-${Date.now()}-${idx}`,
              date: s.date,
              shiftName: p ? p.name : (s.shiftName || '日B'),
              startTime: s.startTime || p?.startTime || (hours >= workHoursPerDay ? '' : '09:00'),
              endTime: s.endTime || p?.endTime || (hours >= workHoursPerDay ? '' : '18:00'),
              breakTime: p?.breakTime ?? (hours >= workHoursPerDay ? 0 : 60),
              paidLeaveHours: hours,
              color: p?.color || (hours > 0 ? '#DB2777' : '#2563EB'),
              bgColor: p?.bgColor || (hours > 0 ? '#FCE7F3' : '#DBEAFE'),
              note: s.note || ''
            };
          });

          if (list.length === 0) {
            setScanMessage('シフトが読み取れませんでした。枠内に日付の記号が含まれているか確認してください。');
            showToast('見つかりませんでした', 'error');
          } else {
            setScanResults(list);
            setScanMessage(`${list.length}件のシフトを抽出しました！`);
            showToast(`${list.length}件抽出成功！`, 'success');
          }
        } catch (e) {
          setScanMessage('スキャンに失敗しました。APIエラーまたは認識エラーです。');
          showToast('スキャンエラー', 'error');
        } finally {
          setIsScanning(false);
        }
      };

      const handleApplyScan = () => {
        const dates = new Set(scanResults.map(s => s.date));
        setShifts(prev => [...prev.filter(s => !dates.has(s.date)), ...scanResults].sort((a,b) => a.date.localeCompare(b.date)));
        setScanResults([]);
        setCroppedImageBase64(null);
        setSelectedImage(null);
        setActiveTab('calendar');
        showToast('カレンダーに登録しました！', 'success');
      };

      const handleSyncCalendar = (shift, type) => {
        const title = encodeURIComponent(`[シフト] ${shift.shiftName}${shift.paidLeaveHours > 0 ? ` (有休${shift.paidLeaveHours}h)` : ''}`);
        const details = encodeURIComponent(`労働時間: ${shift.startTime} - ${shift.endTime}\\n備考: ${shift.note || 'なし'}`);
        const dateClean = shift.date.replace(/-/g, '');
        
        let url = '';
        if (type === 'google') {
          url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dateClean}/${dateClean}&details=${details}`;
        } else if (type === 'apple') {
          const icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${shift.shiftName}\nDTSTART;VALUE=DATE:${dateClean}\nDTEND;VALUE=DATE:${dateClean}\nEND:VEVENT\nEND:VCALENDAR`;
          url = `data:text/calendar;charset=utf8,${encodeURIComponent(icsContent)}`;
        }
        window.open(url, '_blank');
      };

      // カレンダーの日付生成
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const calendarDays = [];
      for (let i = 0; i < firstDay; i++) calendarDays.push(null);
      for (let d = 1; d <= totalDays; d++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        calendarDays.push({ day: d, dateStr: dStr, shift: shifts.find(s => s.date === dStr) });
      }
      while (calendarDays.length % 7 !== 0) calendarDays.push(null);
      const totalWeeks = calendarDays.length / 7;

      // 日付タップ時の処理（スタンプモード or 編集モーダル）
      const handleDateClick = (dateStr, currentShift, e) => {
        if (stampModeActive && select
